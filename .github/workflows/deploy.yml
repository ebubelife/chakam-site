name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # withastro/action@v3 (the previous setup here) hung indefinitely on its
    # install/build step twice in a row on this repo, for no attributable
    # reason (identical steps had succeeded in ~20s on every earlier run) —
    # a wrapper action's own overhead adds a failure mode we don't need.
    # Plain, well-documented GitHub-maintained actions instead: same outcome,
    # one less moving part to hang. A per-step timeout also means a stuck
    # step now fails loudly within minutes instead of hanging for hours.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        timeout-minutes: 5
      - run: npm run build
        timeout-minutes: 5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
